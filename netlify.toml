[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs a current Node LTS.
  NODE_VERSION = "22"

# No SPA catch-all: every route is a prerendered file (scripts/prerender.mjs writes
# index.html, platform.html, industries/*.html, blog/*.html, privacy.html), served by
# Netlify's pretty URLs. Any other path gets 404.html with a real 404 status, and the
# app shows its not-found page.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"

# Hashed build assets never change, so browsers can cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts, images, video and audio keep their names when replaced, so they are cached for a day
# (then served from cache while the browser re-checks them in the background for up to a week).
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
