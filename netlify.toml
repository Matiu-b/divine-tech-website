[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs a current Node LTS.
  NODE_VERSION = "22"

# Single-page app: let React Router handle every path.
# Real files (assets, /__forms.html) are served first; this only catches the rest.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"

# Hashed build assets never change, so browsers can cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
